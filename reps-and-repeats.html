<title>Reps & Repeats — This Week</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Work+Sans:wght@400;500;600&display=swap');

:root{
  --bg:#12160f; --bg2:#181d14; --bg3:#1f251a;
  --border:#2a3123; --border2:#39422f;
  --text:#eef1e6; --text2:#a3ad96; --text3:#68705d;
  --ochre:#c98f3a; --slate:#6f95a4; --green:#6a9a63; --rust:#b6553e;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'Work Sans',sans-serif; background:var(--bg); color:var(--text);
  min-height:100vh; overscroll-behavior:none; padding-bottom:28px;
}
h1,h2,h3,.num{font-family:'Big Shoulders Display',sans-serif;}
.wrap{max-width:520px; margin:0 auto; padding:0 16px;}

header{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--border); padding:16px 0 12px;}
.eyebrow{font-size:12px; color:var(--text3); margin-bottom:2px;}
h1{font-size:26px; font-weight:700; letter-spacing:0.3px; line-height:1;}

.strip{display:flex; align-items:flex-end; gap:6px; height:64px; margin-top:16px;}
.strip-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; background:none; border:none; font-family:inherit;}
.strip-bar-track{width:100%; height:40px; display:flex; align-items:flex-end;}
.strip-bar{width:100%; border-radius:4px 4px 2px 2px; background:var(--border2); transition:background 0.2s, opacity 0.2s;}
.strip-bar.type-rest{background:var(--border);}
.strip-bar.type-mobility{background:var(--slate); opacity:0.55;}
.strip-bar.type-strength{background:var(--slate);}
.strip-bar.type-cardio{background:var(--ochre);}
.strip-bar.done{background:var(--green) !important; opacity:1;}
.strip-day{font-size:10px; letter-spacing:0.5px; color:var(--text3);}
.strip-col.today .strip-day{color:var(--ochre); font-weight:600;}
.strip-dot{width:4px; height:4px; border-radius:50%; background:var(--ochre); margin-top:-2px;}
.strip-dot.hide{visibility:hidden;}

main{padding-top:14px;}
.day-card{background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:10px; overflow:hidden; scroll-margin-top:130px;}
.day-card.is-done{border-color:var(--green);}
.day-head{display:flex; align-items:center; gap:12px; padding:14px 15px; cursor:pointer;}
.day-tag{font-size:10px; letter-spacing:1.5px; color:var(--text3); text-transform:uppercase;}
.day-title{font-size:16px; font-weight:600; margin-top:2px;}
.day-check{width:26px; height:26px; border-radius:50%; border:1.5px solid var(--border2); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:14px; color:transparent;}
.day-check.done{background:var(--green); border-color:var(--green); color:var(--bg);}
.day-chev{margin-left:auto; color:var(--text3); font-size:12px; transition:transform 0.2s;}
.day-chev.open{transform:rotate(180deg);}
.day-body{display:none; border-top:1px solid var(--border); padding:14px 15px 16px;}
.day-body.open{display:block;}
.blurb{font-size:13px; color:var(--text2); line-height:1.55; margin-bottom:14px;}
.section-lbl{font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text3); margin:16px 0 8px;}
.section-lbl:first-child{margin-top:0;}

/* EXERCISE ROWS */
.ex-card{border-bottom:1px solid var(--border);}
.ex-card:last-child{border-bottom:none;}
.ex-row{display:flex; align-items:center; gap:11px; padding:10px 0; cursor:pointer;}
.ex-icon{width:40px; height:40px; border-radius:9px; background:var(--bg3); border:1px solid var(--border2); flex-shrink:0; display:flex; align-items:center; justify-content:center;}
.ex-icon svg{width:26px; height:26px;}
.ex-info{flex:1;}
.ex-name{font-size:14px; font-weight:500;}
.ex-meta{font-size:11px; color:var(--text3); margin-top:1px;}
.ex-detail{display:none; padding:2px 0 12px 51px;}
.ex-detail.open{display:block;}
.ex-desc{font-size:12.5px; color:var(--text2); line-height:1.55;}
.set-pips{display:flex; gap:5px; margin-top:8px;}
.pip{width:26px; height:26px; border-radius:6px; border:1.5px solid var(--border2); background:var(--bg3); color:var(--text3); font-size:11px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;}
.pip.done{background:var(--green); border-color:var(--green); color:var(--bg);}
.timer-live{display:flex; align-items:center; gap:6px;}
.timer-num{font-family:'Big Shoulders Display',sans-serif; font-size:20px; color:var(--ochre); min-width:28px; text-align:center;}
.timer-stop{width:26px; height:26px; border-radius:6px; border:1.5px solid var(--ochre); background:none; color:var(--ochre); font-size:11px; display:flex; align-items:center; justify-content:center; cursor:pointer;}
.rest-chip{display:none; align-items:center; justify-content:space-between; background:var(--bg3); border:1px solid var(--border2); border-radius:7px; padding:7px 11px; margin:6px 0 2px 51px; font-size:12px; color:var(--text2);}
.rest-chip.show{display:flex;}
.rest-chip .rc-num{font-family:'Big Shoulders Display',sans-serif; font-size:16px; color:var(--slate); margin-right:6px;}
.rest-skip{background:none; border:none; color:var(--text3); font-size:11px; text-decoration:underline; cursor:pointer;}
.rest-settings{margin-bottom:14px;}
.ex-row-pips{display:flex; gap:5px; flex-shrink:0;}

.field-lbl{font-size:11px; letter-spacing:0.5px; color:var(--text3); margin:12px 0 6px;}
.pill-row{display:flex; gap:6px;}
.pill{flex:1; text-align:center; padding:9px 4px; border-radius:8px; background:var(--bg3); border:1px solid var(--border2); color:var(--text2); font-size:13px; cursor:pointer;}
.pill.sel{background:var(--ochre); border-color:var(--ochre); color:var(--bg); font-weight:600;}
input[type=number],textarea{width:100%; background:var(--bg3); border:1px solid var(--border2); border-radius:8px; padding:10px 12px; color:var(--text); font-family:inherit; font-size:14px;}
textarea{resize:vertical; min-height:52px;}

.btn{width:100%; padding:13px; border:none; border-radius:9px; font-family:'Work Sans',sans-serif; font-size:14px; font-weight:600; cursor:pointer; margin-top:14px;}
.btn-primary{background:var(--ochre); color:var(--bg);}
.btn-done{background:var(--green); color:var(--bg);}
.btn-undo{background:none; border:1px solid var(--border2); color:var(--text3); margin-top:8px;}
.saved-note{font-size:12px; color:var(--green); margin-top:8px; text-align:center;}

.hist-toggle{text-align:center; font-size:12px; color:var(--text3); padding:14px 0 4px; cursor:pointer;}
.hist-stats{display:flex; gap:8px; margin:10px 0 14px;}
.hist-stat{flex:1; background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:12px 8px; text-align:center;}
.hist-stat .num{font-size:22px; color:var(--ochre);}
.hist-stat .lbl{font-size:9px; letter-spacing:1px; color:var(--text3); text-transform:uppercase; margin-top:2px;}
.hist-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px;}
.hist-row:last-child{border-bottom:none;}
.hist-row .l{color:var(--text2);}
.hist-row .r{color:var(--text3); font-size:12px;}
.version-tag{text-align:right; font-size:10px; color:var(--text3); opacity:0.5; letter-spacing:0.5px; padding:14px 2px 4px;}
</style>
</head>

</div>

// ── STORAGE (localStorage — this file is meant to be opened standalone
// on your phone, not through the Claude.ai artifact preview) ──────────
function loadLog(dateKey){
  try{ return JSON.parse(localStorage.getItem('rr-log-'+dateKey) || 'null'); }
  catch(e){ return null; }
}
function saveLog(dateKey, data){
  try{ localStorage.setItem('rr-log-'+dateKey, JSON.stringify(data)); return true; }
  catch(e){ return false; }
}
function allLogKeys(){
  const keys = [];
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf('rr-log-')===0) keys.push(k);
  }
  return keys;
}

let logs = {};
let openDay = null;

function todayKey(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtShort(dateStr){
  return new Date(dateStr+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function emptyLog(){ return { done:false, sets:{}, coreSets:{}, distance:'', effort:null, notes:'' }; }

function init(){
  PLAN.forEach(day=>{ logs[day.date] = loadLog(day.date) || emptyLog(); });
  document.getElementById('week-range').textContent = fmtShort(PLAN[0].date)+' \u2013 '+fmtShort(PLAN[6].date);
  renderStrip();
  renderDays();
  renderHistoryStats();
}

// ── WEEK STRIP ────────────────────────────────────────────
function renderStrip(){
  const strip = document.getElementById('week-strip');
  strip.innerHTML = '';
  const tk = todayKey();
  PLAN.forEach(day=>{
    const done = logs[day.date] && logs[day.date].done;
    const h = 8 + day.intensity * 10;
    const col = document.createElement('button');
    col.className = 'strip-col' + (day.date===tk ? ' today':'');
    col.onclick = ()=>{ openDayCard(day.key); document.getElementById('card-'+day.key).scrollIntoView({behavior:'smooth', block:'center'}); };
    col.innerHTML =
      '<div class="strip-dot'+(day.date===tk?'':' hide')+'"></div>'+
      '<div class="strip-bar-track"><div class="strip-bar type-'+day.type+(done?' done':'')+'" style="height:'+h+'px;"></div></div>'+
      '<div class="strip-day">'+day.label+'</div>';
    strip.appendChild(col);
  });
}

// ── DAY CARDS ─────────────────────────────────────────────
function renderDays(){
  const wrap = document.getElementById('days');
  wrap.innerHTML = '';
  PLAN.forEach(day=>{
    const log = logs[day.date];
    const card = document.createElement('div');
    card.className = 'day-card' + (log.done ? ' is-done':'');
    card.id = 'card-'+day.key;
    card.innerHTML =
      '<div class="day-head" onclick="toggleDay(\''+day.key+'\')">'+
        '<div class="day-check'+(log.done?' done':'')+'">\u2713</div>'+
        '<div><div class="day-tag">'+day.label+' \u00b7 '+day.tag+'</div><div class="day-title">'+day.title+'</div></div>'+
        '<div class="day-chev" id="chev-'+day.key+'">\u25be</div>'+
      '</div>'+
      '<div class="day-body" id="body-'+day.key+'"></div>';
    wrap.appendChild(card);
  });
}

function toggleDay(key){
  const body = document.getElementById('body-'+key);
  const chev = document.getElementById('chev-'+key);
  const isOpen = body.classList.contains('open');
  clearAllTimers();
  document.querySelectorAll('.day-body.open').forEach(b=>b.classList.remove('open'));
  document.querySelectorAll('.day-chev.open').forEach(c=>c.classList.remove('open'));
  if(!isOpen){
    body.classList.add('open'); chev.classList.add('open');
    openDay = key;
    renderDayBody(key);
  } else { openDay = null; }
}
function openDayCard(key){ if(openDay !== key) toggleDay(key); }

let restDur = parseInt(localStorage.getItem('rr-rest-dur')||'45');
let activeTimers = {};  // rowId -> {interval, dateKey, itemId, kind}
let restTimers = {};    // rowId -> interval

function setRestDur(n){
  restDur = n;
  localStorage.setItem('rr-rest-dur', n);
  document.querySelectorAll('.rest-pill').forEach(el=>{
    el.classList.toggle('sel', parseInt(el.dataset.val)===n);
  });
}
function restSettingsHtml(){
  return '<div class="rest-settings"><div class="field-lbl">Rest between sets</div><div class="pill-row">'+
    [30,45,60].map(n=>'<div class="pill rest-pill'+(n===restDur?' sel':'')+'" data-val="'+n+'" onclick="setRestDur('+n+')">'+n+'s</div>').join('')+
    '</div></div>';
}

function clearAllTimers(){
  Object.values(activeTimers).forEach(t=>clearInterval(t.interval));
  activeTimers = {};
  Object.values(restTimers).forEach(iv=>clearInterval(iv));
  restTimers = {};
}

function timerControlHtml(dateKey, item, kind, done){
  if(done) return '<div class="pip done">\u2713</div>';
  return '<button class="pip" onclick="event.stopPropagation();startItemTimer(\''+dateKey+'\',\''+item.id+'\','+item.dur+',\''+kind+'\')">\u25b6</button>';
}

function exRowHtml(dateKey, item, kind){
  // kind: 'timed' (mobility, tap-to-start countdown), 'core' (same, daily
  // plank block), or 'sets' (strength, tap-through with rest between)
  const log = logs[dateKey];
  const bucket = kind==='core' ? log.coreSets : log.sets;
  const rowId = dateKey+'-'+item.id;
  let ctrlHtml;
  if(kind==='sets'){
    const doneCount = bucket[item.id] || 0;
    let pips = '';
    for(let i=1;i<=item.sets;i++){
      pips += '<div class="pip'+(i<=doneCount?' done':'')+'" onclick="event.stopPropagation();incSet(\''+dateKey+'\',\''+item.id+'\','+item.sets+',\''+kind+'\')">'+(i<=doneCount?'\u2713':i)+'</div>';
    }
    ctrlHtml = pips;
  } else {
    const done = (bucket[item.id]||0) >= 1;
    ctrlHtml = timerControlHtml(dateKey, item, kind, done);
  }
  return '<div class="ex-card">'+
    '<div class="ex-row" onclick="toggleExDetail(\''+rowId+'\')">'+
      '<div class="ex-icon">'+iconSvg(item.icon)+'</div>'+
      '<div class="ex-info"><div class="ex-name">'+item.name+'</div><div class="ex-meta">'+item.meta+'</div></div>'+
      '<div class="ex-row-pips" id="ctrl-'+rowId+'">'+ctrlHtml+'</div>'+
    '</div>'+
    '<div class="rest-chip" id="rest-'+rowId+'"><div><span class="rc-num" id="restnum-'+rowId+'">'+restDur+'</span>rest, then keep going</div><button class="rest-skip" onclick="event.stopPropagation();hideRestChip(\''+rowId+'\')">Skip</button></div>'+
    '<div class="ex-detail" id="det-'+rowId+'"><div class="ex-desc">'+item.desc+'</div></div>'+
    '</div>';
}

function startItemTimer(dateKey, itemId, dur, kind){
  const rowId = dateKey+'-'+itemId;
  if(activeTimers[rowId]) return;
  hideRestChip(rowId);
  let remaining = dur;
  const ctrl = document.getElementById('ctrl-'+rowId);
  if(!ctrl) return;
  ctrl.innerHTML = '<div class="timer-live"><span class="timer-num" id="tnum-'+rowId+'">'+remaining+'</span>'+
    '<button class="timer-stop" onclick="event.stopPropagation();stopItemTimer(\''+rowId+'\')">\u25a0</button></div>';
  const iv = setInterval(()=>{
    remaining--;
    const el = document.getElementById('tnum-'+rowId);
    if(el) el.textContent = remaining;
    if(remaining<=0){
      clearInterval(iv);
      delete activeTimers[rowId];
      completeTimedItem(dateKey, itemId, kind, rowId);
    }
  },1000);
  activeTimers[rowId] = {interval:iv, dateKey, itemId, kind};
}
function stopItemTimer(rowId){
  const t = activeTimers[rowId];
  if(!t) return;
  clearInterval(t.interval);
  delete activeTimers[rowId];
  const day = PLAN.find(d=>d.date===t.dateKey);
  const item = (t.kind==='core' ? CORE : (day ? day.items : [])).find(i=>i.id===t.itemId);
  const ctrl = document.getElementById('ctrl-'+rowId);
  if(ctrl && item) ctrl.innerHTML = timerControlHtml(t.dateKey, item, t.kind, false);
}
function completeTimedItem(dateKey, itemId, kind, rowId){
  const log = logs[dateKey];
  const bucket = kind==='core' ? log.coreSets : log.sets;
  bucket[itemId] = 1;
  saveLog(dateKey, log);
  const ctrl = document.getElementById('ctrl-'+rowId);
  if(ctrl) ctrl.innerHTML = '<div class="pip done">\u2713</div>';
  showRestChip(rowId);
}

function showRestChip(rowId){
  hideRestChip(rowId);
  const chip = document.getElementById('rest-'+rowId);
  const numEl = document.getElementById('restnum-'+rowId);
  if(!chip) return;
  let remaining = restDur;
  if(numEl) numEl.textContent = remaining;
  chip.classList.add('show');
  const iv = setInterval(()=>{
    remaining--;
    if(numEl) numEl.textContent = remaining;
    if(remaining<=0) hideRestChip(rowId);
  },1000);
  restTimers[rowId] = iv;
}
function hideRestChip(rowId){
  if(restTimers[rowId]){ clearInterval(restTimers[rowId]); delete restTimers[rowId]; }
  const chip = document.getElementById('rest-'+rowId);
  if(chip) chip.classList.remove('show');
}

function toggleExDetail(id){
  const el = document.getElementById('det-'+id);
  if(el) el.classList.toggle('open');
}

function renderDayBody(key){
  clearAllTimers();
  const day = PLAN.find(d=>d.key===key);
  const log = logs[day.date];
  const body = document.getElementById('body-'+key);
  let html = '<div class="blurb">'+day.blurb+'</div>';
  html += restSettingsHtml();

  if(day.type === 'mobility'){
    html += day.items.map(it=>exRowHtml(day.date, it, 'timed')).join('');
  } else if(day.type === 'strength'){
    html += day.items.map(it=>exRowHtml(day.date, it, 'sets')).join('');
  }

  // Daily core block — every day, per your request
  html += '<div class="section-lbl">Core \u2014 5-Minute Plank Challenge</div>';
  html += CORE.map(it=>exRowHtml(day.date, it, 'core')).join('');

  if(day.type === 'cardio'){
    html += '<div class="field-lbl">How\u2019d it feel?</div>'+
      '<div class="pill-row">'+[1,2,3,4,5].map(n=>'<div class="pill effort-pill'+(log.effort===n?' sel':'')+'" data-val="'+n+'" onclick="setEffort(\''+day.date+'\','+n+')">'+n+'</div>').join('')+'</div>'+
      '<div class="field-lbl">Distance (mi, optional)</div>'+
      '<input type="number" step="0.1" id="dist-'+key+'" value="'+(log.distance||'')+'" placeholder="e.g. 2.5">'+
      '<div class="field-lbl">Notes (optional)</div>'+
      '<textarea id="notes-'+key+'" placeholder="How the legs felt, anything worth remembering...">'+(log.notes||'')+'</textarea>';
  }

  html += doneButtonHtml(log, key, day.type==='rest' ? 'Mark day complete' : null);
  body.innerHTML = html;
}

function doneButtonHtml(log, key, label){
  if(log.done){
    return '<div class="saved-note">Saved to your device \u2713</div>'+
      '<button class="btn btn-undo" onclick="undoDay(\''+key+'\')">Undo</button>';
  }
  return '<button class="btn btn-done" onclick="finishDay(\''+key+'\')">'+(label||'Mark day complete')+'</button>';
}

function incSet(dateKey, itemId, maxSets, kind){
  const log = logs[dateKey];
  const bucket = kind==='core' ? log.coreSets : log.sets;
  const rowId = dateKey+'-'+itemId;
  const next = ((bucket[itemId]||0) + 1) % (maxSets+1);
  bucket[itemId] = next;
  saveLog(dateKey, log);

  const ctrl = document.getElementById('ctrl-'+rowId);
  if(ctrl){
    let pips = '';
    for(let i=1;i<=maxSets;i++){
      pips += '<div class="pip'+(i<=next?' done':'')+'" onclick="event.stopPropagation();incSet(\''+dateKey+'\',\''+itemId+'\','+maxSets+',\''+kind+'\')">'+(i<=next?'\u2713':i)+'</div>';
    }
    ctrl.innerHTML = pips;
  }
  if(next>0 && next<maxSets) showRestChip(rowId); else hideRestChip(rowId);
}
function setEffort(dateKey, n){
  const log = logs[dateKey];
  log.effort = n;
  saveLog(dateKey, log);
  const key = PLAN.find(d=>d.date===dateKey).key;
  document.querySelectorAll('#body-'+key+' .effort-pill').forEach(el=>{
    el.classList.toggle('sel', parseInt(el.dataset.val)===n);
  });
}
function finishDay(key){
  const day = PLAN.find(d=>d.key===key);
  const log = logs[day.date];
  if(day.type === 'cardio'){
    const distEl = document.getElementById('dist-'+key);
    const notesEl = document.getElementById('notes-'+key);
    if(distEl) log.distance = distEl.value;
    if(notesEl) log.notes = notesEl.value;
  }
  log.done = true;
  log.completedAt = new Date().toISOString();
  saveLog(day.date, log);
  renderDayBody(key); renderStrip(); renderDays(); renderHistoryStats();
}
function undoDay(key){
  const day = PLAN.find(d=>d.key===key);
  const log = logs[day.date];
  log.done = false;
  saveLog(day.date, log);
  renderDayBody(key); renderStrip(); renderDays(); renderHistoryStats();
}

// ── HISTORY / STREAK ──────────────────────────────────────
function toggleHistory(){
  const h = document.getElementById('history');
  const vis = h.style.display !== 'none';
  h.style.display = vis ? 'none' : 'block';
  document.getElementById('hist-toggle').textContent = vis ? 'Show history & streak' : 'Hide history';
}
function renderHistoryStats(){
  const keys = allLogKeys();
  let entries = [];
  keys.forEach(k=>{
    try{
      const data = JSON.parse(localStorage.getItem(k));
      if(data && data.done) entries.push({ date:k.replace('rr-log-',''), ...data });
    }catch(e){}
  });
  entries.sort((a,b)=> a.date < b.date ? 1 : -1);

  document.getElementById('stat-total').textContent = entries.length;
  const weekDates = PLAN.map(d=>d.date);
  document.getElementById('stat-week').textContent = entries.filter(e=>weekDates.includes(e.date)).length+'/7';

  const doneSet = new Set(entries.map(e=>e.date));
  let streak = 0, d = new Date();
  while(true){
    const k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(doneSet.has(k)){ streak++; d.setDate(d.getDate()-1); } else break;
  }
  document.getElementById('stat-streak').textContent = streak;

  const list = document.getElementById('hist-list');
  list.innerHTML = entries.slice(0,20).map(e=>{
    const planDay = PLAN.find(d=>d.date===e.date);
    const title = planDay ? planDay.title : e.date;
    const extra = e.distance ? e.distance+' mi' : (e.effort ? 'Effort '+e.effort+'/5' : '');
    return '<div class="hist-row"><div class="l">'+fmtShort(e.date)+' \u2014 '+title+'</div><div class="r">'+extra+'</div></div>';
  }).join('') || '<div class="blurb">Nothing logged yet.</div>';
}

init();
</script>
</body>
</html>
